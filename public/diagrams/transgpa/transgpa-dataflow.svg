<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t">
<!-- Board: transgpa-dataflow. Data flow of a transcript through TransGPA; everything happens inside the browser and the server lane is empty on purpose. -->
<title id="t">Data-flow diagram showing transcript parsing entirely client-side.</title>
<defs>
  <style>
    text { font-family: Inter, system-ui, sans-serif; fill: #222222; }
    .k  { font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; }
    .l  { font-size: 18px; }
    .s  { font-size: 16px; fill: #727272; }
    .a  { fill: #033FED; }
    .box { fill: none; stroke: #222222; stroke-width: 1.5; }
    .ln  { fill: none; stroke: #222222; stroke-width: 1.5; }
    .acc { stroke: #033FED; }
    .dash { stroke-dasharray: 6 6; }
  </style>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#222222"/>
  </marker>
</defs>

<!-- Student's device: the one thing the diagram is about -->
<!-- Frame top edge starts after the label chip so the chip sits in the corner without masking -->
<path class="ln acc" d="M364 70 H1140 V470 H60 V86"/>
<rect class="box acc" x="60" y="54" width="304" height="32"/>
<text class="k a" x="76" y="77">Student's browser, local only</text>
<text class="s" x="1124" y="108" text-anchor="end">Nothing in this frame makes a network request</text>

<!-- Stage 1: file picker -->
<rect class="box" x="100" y="190" width="200" height="120"/>
<text class="k" x="116" y="216">01 File picker</text>
<text class="l" x="116" y="252">transcript.pdf</text>
<text class="s" x="116" y="280">drop zone or input</text>
<text class="s" x="116" y="300">File object in memory</text>

<!-- Stage 2: pdf.js -->
<path class="ln" d="M300 250 H358" marker-end="url(#arr)"/>
<text class="s" x="330" y="236" text-anchor="middle">bytes</text>
<rect class="box" x="360" y="190" width="200" height="120"/>
<text class="k" x="376" y="216">02 pdf.js</text>
<text class="l" x="376" y="252">getTextContent()</text>
<text class="s" x="376" y="280">text runs with x,y</text>
<text class="s" x="376" y="300">worker thread</text>

<!-- Stage 3: parser -->
<path class="ln" d="M560 250 H618" marker-end="url(#arr)"/>
<text class="s" x="590" y="236" text-anchor="middle">text</text>
<rect class="box" x="620" y="190" width="200" height="120"/>
<text class="k" x="636" y="216">03 Parser</text>
<text class="l" x="636" y="252">rows to courses</text>
<text class="s" x="636" y="280">code, credits, grade</text>
<text class="s" x="636" y="300">grouped by semester</text>

<!-- Stage 4: state + charts -->
<path class="ln" d="M820 250 H878" marker-end="url(#arr)"/>
<text class="s" x="850" y="236" text-anchor="middle">courses</text>
<rect class="box" x="880" y="190" width="220" height="120"/>
<text class="k" x="896" y="216">04 Simulation</text>
<text class="l" x="896" y="252">editable grades</text>
<text class="s" x="896" y="280">projected CGPA</text>
<text class="s" x="896" y="300">Recharts, re-renders</text>

<!-- Edit loop: a grade edit re-runs the projection without touching the parser -->
<path class="ln dash" d="M990 310 V380 H730 V310" marker-end="url(#arr)"/>
<text class="s" x="860" y="372" text-anchor="middle">edit a grade, recompute, no re-parse</text>

<!-- Where the data lives -->
<path class="ln acc" d="M60 420 H1140"/>
<text class="k a" x="76" y="450">State lives in React memory for the tab's lifetime</text>
<text class="s" x="1124" y="450" text-anchor="end">close the tab, it is gone</text>

<!-- The boundary -->
<path class="ln acc" d="M600 470 V560"/>
<line x1="585" y1="545" x2="615" y2="575" stroke="#033FED" stroke-width="1.5"/>
<line x1="615" y1="545" x2="585" y2="575" stroke="#033FED" stroke-width="1.5"/>
<text class="k a" x="630" y="566">No upload. The request is never built.</text>

<!-- Server lane: deliberately empty -->
<rect class="box dash" x="60" y="590" width="1080" height="110" style="stroke:#727272"/>
<text class="k" x="76" y="620" fill="#727272" style="fill:#727272">Server</text>
<text class="l" x="76" y="656">No upload endpoint. No parser. No storage.</text>
<text class="s" x="76" y="684">Vercel serves static files once; the transcript is never one of them.</text>
<text class="l" x="1124" y="656" text-anchor="end">0 bytes received</text>
</svg>
