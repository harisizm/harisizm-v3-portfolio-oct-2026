<?xml version="1.0" encoding="UTF-8"?>
<!-- Board tourgenz-architecture: traveller app, five vendor portals and the admin control room over one Express/PostgreSQL core -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#222222">
  <title id="t">Architecture diagram of the Tourgenz platform.</title>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
  </defs>
  <style>
    .box{fill:none;stroke:#222222;stroke-width:1.5}
    .acc{stroke:#033FED}
    .ln{fill:none;stroke:#222222;stroke-width:1.5}
    .cap{font-size:14px;letter-spacing:0.08em;fill:#727272}
    .h{font-size:18px;font-weight:600}
    .sub{fill:#727272}
    .mid{text-anchor:middle}
  </style>

  <text class="cap" x="60" y="52">SURFACES</text>

  <rect class="box" x="60" y="70" width="260" height="100"/>
  <text class="h mid" x="190" y="116">Traveller app</text>
  <text class="sub mid" x="190" y="146">Next.js 15, MapLibre GL</text>

  <rect class="box" x="360" y="70" width="480" height="100"/>
  <text class="h mid" x="600" y="102">Five vendor portals</text>
  <rect class="box" x="376" y="118" width="80" height="36"/><text class="sub mid" x="416" y="142">1</text>
  <rect class="box" x="468" y="118" width="80" height="36"/><text class="sub mid" x="508" y="142">2</text>
  <rect class="box" x="560" y="118" width="80" height="36"/><text class="sub mid" x="600" y="142">3</text>
  <rect class="box" x="652" y="118" width="80" height="36"/><text class="sub mid" x="692" y="142">4</text>
  <rect class="box" x="744" y="118" width="80" height="36"/><text class="sub mid" x="784" y="142">5</text>

  <rect class="box" x="880" y="70" width="260" height="100"/>
  <text class="h mid" x="1010" y="116">Admin control room</text>
  <text class="sub mid" x="1010" y="146">over both sides</text>

  <path class="ln" d="M190 170V210H1010V170M600 170V248" marker-end="url(#ink)"/>

  <text class="cap" x="300" y="238">ONE CORE</text>
  <rect class="box acc" x="300" y="250" width="600" height="150"/>
  <text class="h mid" x="600" y="284" fill="#033FED">Express.js API</text>
  <text x="330" y="322">Booking transitions, one tested path</text>
  <text x="330" y="350">Wallet ledger with holds and audit</text>
  <text x="620" y="322">Sessions, bcrypt, per-role checks</text>
  <text x="620" y="350">Trip planner grounded in catalog</text>
  <text class="sub mid" x="600" y="382">input validation on every endpoint, strict TypeScript</text>

  <text class="cap" x="300" y="608">STORAGE AND MODELS</text>
  <path class="ln" d="M470 400V458" marker-end="url(#ink)"/>
  <path class="ln" d="M780 400V458" marker-end="url(#ink)"/>
  <path class="ln" d="M870 400V430H1030V458" marker-end="url(#ink)"/>

  <rect class="box" x="300" y="460" width="340" height="120"/>
  <text class="h mid" x="470" y="500">PostgreSQL</text>
  <text class="mid" x="470" y="528">PostGIS, pgvector, Prisma</text>
  <text class="sub mid" x="470" y="556">111 hand-written migrations</text>

  <rect class="box" x="660" y="460" width="240" height="120"/>
  <text class="h mid" x="780" y="506">OpenRouter LLM</text>
  <text class="sub mid" x="780" y="536">planner, area insights</text>

  <rect class="box" x="920" y="460" width="220" height="120"/>
  <text class="h mid" x="1030" y="506">Cloudinary</text>
  <text class="sub mid" x="1030" y="536">media storage</text>

  <path class="ln" d="M120 170V458" stroke-dasharray="6 6" marker-end="url(#ink)"/>
  <text class="sub" x="132" y="312" font-size="14">tiles direct to</text>
  <text class="sub" x="132" y="332" font-size="14">the browser</text>
  <rect class="box" x="60" y="460" width="200" height="120"/>
  <text class="h mid" x="160" y="506">Open tile sources</text>
  <text class="sub mid" x="160" y="536">no API key</text>

  <text class="sub" x="60" y="680">One codebase serves all seven surfaces. The map never touches the API or a metered key.</text>
</svg>
