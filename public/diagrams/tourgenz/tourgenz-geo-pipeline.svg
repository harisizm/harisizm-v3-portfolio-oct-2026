<?xml version="1.0" encoding="UTF-8"?>
<!-- Board tourgenz-geo-pipeline: catalog write, debounced PostgreSQL queue, 8,445 regenerated grid cells -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#222222">
  <title id="t">Data-flow diagram of the Tourgenz geospatial precompute pipeline.</title>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
  </defs>
  <style>
    .box{fill:none;stroke:#222222;stroke-width:1.5}
    .ln{fill:none;stroke:#222222;stroke-width:1.5}
    .accl{fill:none;stroke:#033FED;stroke-width:1.5}
    .cap{font-size:14px;letter-spacing:0.08em;fill:#727272}
    .h{font-size:18px;font-weight:600}
    .sub{fill:#727272}
    .mid{text-anchor:middle}
  </style>

  <text class="cap" x="40" y="110">PIPELINE</text>

  <rect class="box" x="40" y="140" width="190" height="100"/>
  <text class="h mid" x="135" y="176">Catalog write</text>
  <text class="sub mid" x="135" y="202">a destination added</text>
  <text class="sub mid" x="135" y="224">or edited, 493 curated</text>
  <path class="ln" d="M230 190H268" marker-end="url(#ink)"/>

  <rect class="box" x="270" y="140" width="150" height="100"/>
  <text class="h mid" x="345" y="176">Enqueue</text>
  <text class="sub mid" x="345" y="202">one queue row</text>
  <text class="sub mid" x="345" y="224">per write</text>
  <path class="ln" d="M420 190H458" marker-end="url(#ink)"/>

  <rect class="box" x="460" y="140" width="260" height="100" stroke="#033FED"/>
  <text class="h mid" x="590" y="176" fill="#033FED">Debounced queue</text>
  <text class="mid" x="590" y="202">in PostgreSQL, waits</text>
  <text class="mid" x="590" y="224">until the burst ends</text>
  <path class="ln" d="M720 190H758" marker-end="url(#ink)"/>

  <rect class="box" x="760" y="140" width="160" height="100"/>
  <text class="h mid" x="840" y="176">Rebuild worker</text>
  <text class="sub mid" x="840" y="202">OpenRouter writes</text>
  <text class="sub mid" x="840" y="224">area insights</text>
  <path class="ln" d="M920 190H958" marker-end="url(#ink)"/>

  <rect class="box" x="960" y="140" width="200" height="100"/>
  <text class="h mid" x="1060" y="176">8,445 grid cells</text>
  <text class="sub mid" x="1060" y="202">PostGIS, read by</text>
  <text class="sub mid" x="1060" y="224">the globe</text>

  <text class="cap" x="40" y="340">TIMING</text>

  <!-- time axis -->
  <path class="ln" d="M60 460H1138" marker-end="url(#ink)"/>
  <text class="sub" x="1100" y="488" text-anchor="end">time</text>

  <!-- burst one -->
  <text class="mid" x="162" y="400">catalog writes</text>
  <path class="ln" d="M120 420V460M138 420V460M150 420V460M190 420V460M205 420V460"/>
  <path class="ln" d="M205 476V486M205 481H330M330 476V486"/>
  <text class="sub mid" x="267" y="510" font-size="14">debounce window</text>
  <path class="accl" d="M330 460V410"/>
  <rect x="324" y="404" width="12" height="12" fill="#033FED"/>
  <text class="mid" x="330" y="386" fill="#033FED">one rebuild</text>

  <!-- burst two -->
  <text class="mid" x="585" y="400">catalog writes</text>
  <path class="ln" d="M560 420V460M575 420V460M610 420V460"/>
  <path class="ln" d="M610 476V486M610 481H735M735 476V486"/>
  <text class="sub mid" x="672" y="510" font-size="14">debounce window</text>
  <path class="accl" d="M735 460V410"/>
  <rect x="729" y="404" width="12" height="12" fill="#033FED"/>
  <text class="mid" x="735" y="386" fill="#033FED">one rebuild</text>

  <text class="sub" x="40" y="600">A burst of writes costs one rebuild, not one per write, and the rebuild only starts once the writes have stopped.</text>
</svg>
