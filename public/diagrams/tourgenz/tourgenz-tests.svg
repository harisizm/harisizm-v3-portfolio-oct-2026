<?xml version="1.0" encoding="UTF-8"?>
<!-- Board tourgenz-tests: ~2,000 tests across 214 files (one square each) and the 111 migrations (one tick each) underneath -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#222222">
  <title id="t">Panel showing Tourgenz test and migration counts.</title>
  <defs>
    <pattern id="file" x="52" y="240" width="26" height="26" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#033FED"/></pattern>
    <pattern id="migration" x="52" y="540" width="9.6" height="60" patternUnits="userSpaceOnUse"><rect width="1.5" height="60" fill="#222222"/></pattern>
  </defs>
  <style>
    .num{font-size:72px;font-weight:500;letter-spacing:-0.02em}
    .cap{font-size:14px;letter-spacing:0.08em;fill:#727272}
    .sub{fill:#727272}
  </style>

  <text class="num" x="52" y="130">~2,000</text>
  <text x="52" y="166">automated tests</text>
  <text class="sub" x="52" y="190" font-size="14">Vitest, against a separate test database</text>

  <text class="num" x="452" y="130">214</text>
  <text x="452" y="166">test files</text>
  <text class="sub" x="452" y="190" font-size="14">one square below per file</text>

  <text class="num" x="852" y="130">111</text>
  <text x="852" y="166">SQL migrations</text>
  <text class="sub" x="852" y="190" font-size="14">hand-written, PostGIS and pgvector</text>

  <!-- 214 files: 7 full rows of 27, then 25 -->
  <rect x="52" y="240" width="702" height="182" fill="url(#file)"/>
  <rect x="52" y="422" width="650" height="26" fill="url(#file)"/>
  <text class="cap" x="52" y="488">214 FILES, ~2,000 TESTS</text>

  <!-- 111 migrations, in order -->
  <text class="cap" x="52" y="528">111 MIGRATIONS, IN THE ORDER THEY RAN</text>
  <rect x="52" y="540" width="1057.5" height="60" fill="url(#migration)"/>
  <path d="M52 600H1109.5" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text class="sub" x="52" y="626" font-size="14">0001</text>
  <text class="sub" x="1109.5" y="626" font-size="14" text-anchor="end">0111</text>

  <text class="sub" x="52" y="700">No CI pipeline. The suite and the migrations are what stand between a change and production.</text>
</svg>
