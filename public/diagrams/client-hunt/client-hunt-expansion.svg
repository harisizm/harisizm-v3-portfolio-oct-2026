<?xml version="1.0" encoding="UTF-8"?>
<!-- Board client-hunt-expansion: one viewport query versus a coordinate grid of overlapping queries over the same area -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#222222">
  <title id="t">Diagram of coordinate-expansion discovery across a search area.</title>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="8" fill="#033FED"/></pattern>
  </defs>
  <style>
    .area{fill:none;stroke:#222222;stroke-width:1.5;stroke-dasharray:6 6}
    .q{fill:none;stroke:#222222;stroke-width:1.5}
    .ln{fill:none;stroke:#222222;stroke-width:1.5}
    .cap{font-size:14px;letter-spacing:0.08em;fill:#727272}
    .sub{fill:#727272}
  </style>

  <!-- one query -->
  <text class="cap" x="60" y="52">ONE QUERY, REJECTED</text>
  <rect class="area" x="60" y="80" width="320" height="320"/>
  <circle class="q" cx="220" cy="240" r="70"/>
  <rect x="215" y="235" width="10" height="10" fill="#222222"/>
  <text x="60" y="440">One viewport of results. The rest of</text>
  <text x="60" y="464">the area is never searched.</text>
  <text class="sub" x="60" y="500">Johar Town: 33 results shown.</text>

  <text class="sub" x="60" y="560" font-size="14">dashed: the area the team asked for</text>
  <text class="sub" x="60" y="582" font-size="14">circle: what one query returns</text>

  <!-- coordinate expansion -->
  <text class="cap" x="550" y="52" fill="#033FED">COORDINATE EXPANSION</text>
  <rect class="area" x="550" y="80" width="560" height="560"/>

  <g class="q">
    <circle cx="670" cy="200" r="115"/><circle cx="830" cy="200" r="115"/><circle cx="990" cy="200" r="115"/>
    <circle cx="670" cy="360" r="115"/><circle cx="990" cy="360" r="115"/>
    <circle cx="670" cy="520" r="115"/><circle cx="830" cy="520" r="115"/><circle cx="990" cy="520" r="115"/>
  </g>
  <path d="M910 277.4A115 115 0 0 1 910 442.6A115 115 0 0 1 910 277.4Z" fill="url(#hatch)"/>
  <circle cx="830" cy="360" r="115" fill="none" stroke="#033FED" stroke-width="1.5"/>

  <!-- expansion from the first query outward -->
  <g class="ln" marker-end="url(#ink)">
    <path d="M830 344V218"/><path d="M830 376V502"/>
    <path d="M814 360H688"/><path d="M846 360H972"/>
    <path d="M818 348L682 212"/><path d="M842 348L978 212"/>
    <path d="M818 372L682 508"/><path d="M842 372L978 508"/>
  </g>

  <g fill="#222222">
    <rect x="665" y="195" width="10" height="10"/><rect x="825" y="195" width="10" height="10"/><rect x="985" y="195" width="10" height="10"/>
    <rect x="665" y="355" width="10" height="10"/><rect x="985" y="355" width="10" height="10"/>
    <rect x="665" y="515" width="10" height="10"/><rect x="825" y="515" width="10" height="10"/><rect x="985" y="515" width="10" height="10"/>
  </g>
  <rect x="823" y="353" width="14" height="14" fill="#033FED"/>

  <text x="550" y="680">Queries step outward from the centre and overlap on purpose.</text>
  <rect x="550" y="696" width="20" height="20" fill="url(#hatch)" stroke="#033FED" stroke-width="1.5"/>
  <text x="582" y="712">overlap: the same place returned twice, dropped with a reason</text>
  <text class="sub" x="550" y="744">Johar Town: 164 places found.</text>
</svg>
