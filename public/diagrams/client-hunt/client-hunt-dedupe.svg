<?xml version="1.0" encoding="UTF-8"?>
<!-- Board client-hunt-dedupe: real SQLite shape; duplicates flagged with a reason, never dropped -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#222222">
<title id="t">SQLite schema: hunts, places with dup_flag and dup_reason, master_numbers, and one flagged row's path into the export.</title>
<defs>
<marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#222222"/></marker>
<marker id="acc" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#033FED"/></marker>
</defs>
<style>
.box,.ln{fill:none;stroke:#222222;stroke-width:1.5}
.al{fill:none;stroke:#033FED;stroke-width:1.5}
.a{marker-end:url(#ink)}
.aa{marker-end:url(#acc)}
.cap{font-size:14px;letter-spacing:0.08em;fill:#727272}
.h{font-size:18px;font-weight:600}
.k,.key,.kb{font-size:14px;fill:#727272}
.key,.kb{text-anchor:end}
.kb{fill:#033FED}
.tag{fill:#033FED;font-weight:600}
.s{font-size:15px}
.mono,.m3{font-family:Consolas,monospace}
.mono{font-size:15px}
.m3{font-size:13px}
.d{stroke-dasharray:6 6}
</style>
<text class="cap" x="60" y="40">SQLITE, ONE FILE, WRITTEN AS EACH PLACE LANDS</text>
<rect class="box" x="60" y="80" width="250" height="296"/>
<path class="ln" d="M60 116H310"/>
<text class="h" x="74" y="105">hunts</text>
<text x="74" y="146">id</text><text class="key" x="296" y="146">PK</text>
<text x="74" y="170">keyword</text>
<text x="74" y="194">city</text>
<text x="74" y="218">area</text>
<text x="74" y="242">subarea</text>
<text x="74" y="266">query</text>
<text x="74" y="290">status</text>
<text x="74" y="314">total_found</text>
<text x="74" y="338">fetched_count</text>
<text class="k" x="74" y="362">+ 15 limit and resume columns</text>
<rect class="box" x="380" y="80" width="460" height="296"/>
<path class="ln" d="M380 116H840"/>
<text class="h" x="394" y="105">places</text>
<text x="394" y="146">id</text><text class="key" x="596" y="146">PK</text>
<text x="394" y="170">hunt_id</text><text class="key" x="596" y="170">FK</text>
<text x="394" y="194">name</text>
<text x="394" y="218">phone</text>
<text x="394" y="242">email</text>
<text x="394" y="266">address</text>
<text x="394" y="290">website</text>
<text x="394" y="314">rating</text>
<text x="394" y="338">reviews</text>
<text x="394" y="362">category</text>
<text x="620" y="146">plus_code</text>
<text x="620" y="170">lat</text>
<text x="620" y="194">lng</text>
<text x="620" y="218">maps_url</text>
<text x="620" y="242">discovered_at</text>
<text x="620" y="266">fetched_at</text>
<text x="620" y="290">fetch_error</text>
<rect class="al" x="612" y="322" width="214" height="48"/>
<text class="tag" x="620" y="338">dup_flag</text><text class="kb" x="818" y="338">0 or 1</text>
<text class="tag" x="620" y="362">dup_reason</text><text class="kb" x="818" y="362">text</text>
<rect class="box" x="920" y="80" width="220" height="104"/>
<path class="ln" d="M920 116H1140"/>
<text class="h" x="934" y="105">master_numbers</text>
<text x="934" y="146">phone</text><text class="key" x="1126" y="146">PK</text>
<text x="934" y="170">added_at</text>
<rect class="box d" x="920" y="232" width="220" height="144"/>
<text class="cap" x="934" y="258">DUPLICATE CHECK</text>
<text class="s" x="934" y="290">phone in master_numbers</text>
<text class="s" x="934" y="314">phone already in places</text>
<text class="s" x="934" y="338">same name in this hunt</text>
<text class="s" x="934" y="362">place seen in an earlier run</text>
<path class="ln a" d="M310 146H345V170H378"/>
<path class="ln a" d="M1030 184V230"/>
<path class="ln a" d="M840 290H880V276H918"/>
<path class="al aa" d="M920 346H828"/>
<text class="k" x="846" y="266">lookup</text>
<text class="tag" x="846" y="400" font-size="14">flag + reason</text>
<text class="cap" x="60" y="446">ONE ROW, FROM MAPS TO THE SPREADSHEET</text>
<path class="ln" d="M60 458H1140"/>
<rect class="box" x="60" y="486" width="230" height="188"/>
<text class="h" x="74" y="514">collected</text>
<text class="s" x="74" y="548">Saved to places the moment</text>
<text class="s" x="74" y="570">its details load. A crash or</text>
<text class="s" x="74" y="592">cancel loses nothing on disk.</text>
<text class="k" x="74" y="654">one INSERT, then one UPDATE</text>
<path class="ln a" d="M290 580H338"/>
<rect class="al" x="340" y="486" width="230" height="188"/>
<text class="h" x="354" y="514" fill="#033FED">flagged, kept</text>
<text class="mono" x="354" y="548" fill="#033FED">dup_flag = 1</text>
<text class="mono" x="354" y="572" fill="#033FED">dup_reason =</text>
<text class="m3" x="354" y="594">already saved as "Zaiqa</text>
<text class="m3" x="354" y="612">Hostel" in the Johar Town</text>
<text class="m3" x="354" y="630">search</text>
<path class="al aa" d="M570 580H618"/>
<rect class="box" x="620" y="486" width="230" height="188"/>
<text class="h" x="634" y="514">exported, tinted</text>
<text class="s" x="634" y="548">Two columns added:</text>
<text class="mono" x="634" y="572">Duplicate?  YES</text>
<text class="mono" x="634" y="594">Duplicate Reason  ...</text>
<rect x="634" y="612" width="14" height="14" fill="#9A6700"/>
<text class="s" x="656" y="624">whole row in amber text</text>
<path class="ln a" d="M850 580H898"/>
<rect class="box d" x="900" y="486" width="240" height="188"/>
<text class="h" x="914" y="514" fill="#727272">hidden, if asked</text>
<rect class="box" x="914" y="538" width="16" height="16"/>
<path class="ln" d="M917 546L921 550L928 541"/>
<text class="s" x="940" y="551">hide repeated ones</text>
<text class="s" x="914" y="584">A per-file export filter.</text>
<text class="s" x="914" y="606">The database row is untouched</text>
<text class="s" x="914" y="628">the next export can show it.</text>
<text class="k" x="914" y="660">excludeDuplicates, off by default</text>
<text fill="#727272" x="60" y="716">Nothing is thrown away. The reason travels with the row, and the team decides.</text>
</svg>
