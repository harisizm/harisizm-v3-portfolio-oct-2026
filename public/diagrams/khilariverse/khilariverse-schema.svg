<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t">
<!-- Board: khilariverse-schema. The three Mongoose collections, their links, and the adminAuth role boundary cutting across the endpoints beneath them. -->
<title id="t">Schema diagram of the Khilariverse data model.</title>
<defs>
  <style>
    text { font-family: Inter, system-ui, sans-serif; fill: #222222; }
    .k  { font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; }
    .l  { font-size: 18px; }
    .s  { font-size: 16px; fill: #727272; }
    .a  { fill: #033FED; }
    .box { fill: none; stroke: #222222; stroke-width: 1.5; }
    .ln  { fill: none; stroke: #222222; stroke-width: 1.5; }
    .acc { stroke: #033FED; }
    .dash { stroke-dasharray: 6 6; }
  </style>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#222222"/>
  </marker>
</defs>

<!-- users -->
<rect class="box" x="60" y="70" width="320" height="236"/>
<path class="ln" d="M60 106 H380"/>
<text class="k" x="76" y="95">users</text>
<text class="s" x="364" y="95" text-anchor="end">mongoose</text>
<g class="l">
  <text x="76" y="134">name</text>
  <text x="76" y="162">email <tspan class="s">unique</tspan></text>
  <text x="76" y="190">password <tspan class="s">bcrypt hash</tspan></text>
  <text x="76" y="218">cartData <tspan class="s">{ productId: qty }</tspan></text>
  <text x="76" y="246" class="a" style="font-weight:600">role <tspan style="font-weight:400">'user' | 'admin'</tspan></text>
  <text x="76" y="274">lastLogin</text>
</g>

<!-- products -->
<rect class="box" x="440" y="70" width="320" height="376"/>
<path class="ln" d="M440 106 H760"/>
<text class="k" x="456" y="95">products</text>
<text class="s" x="744" y="95" text-anchor="end">100+ docs</text>
<g class="l">
  <text x="456" y="134">name, brand</text>
  <text x="456" y="162">category, subCategory</text>
  <text x="456" y="190">price, originalPrice</text>
  <text x="456" y="218">image[] <tspan class="s">4 Cloudinary URLs</tspan></text>
  <text x="456" y="246">colors[] <tspan class="s">id, label, hex</tspan></text>
  <text x="456" y="274">specs[], tags[]</text>
  <text x="456" y="302">rating, reviews</text>
  <text x="456" y="330">date</text>
</g>
<text class="s" x="456" y="372">Variants are colours on one</text>
<text class="s" x="456" y="392">document, not rows of their own.</text>
<text class="s" x="456" y="424">Images never touch the app server.</text>

<!-- orders -->
<rect class="box" x="820" y="70" width="320" height="320"/>
<path class="ln" d="M820 106 H1140"/>
<text class="k" x="836" y="95">orders</text>
<text class="s" x="1124" y="95" text-anchor="end">default 'Order Placed'</text>
<g class="l">
  <text x="836" y="134">userId <tspan class="s">users._id</tspan></text>
  <text x="836" y="162">items[] <tspan class="s">product snapshot, qty</tspan></text>
  <text x="836" y="190">amount</text>
  <text x="836" y="218">address <tspan class="s">incl. email</tspan></text>
  <text x="836" y="246">status</text>
  <text x="836" y="274">paymentMethod <tspan class="s">COD</tspan></text>
  <text x="836" y="302">payment <tspan class="s">false</tspan></text>
  <text x="836" y="330">date</text>
</g>
<text class="s" x="836" y="368">Placing one sends a Nodemailer receipt.</text>

<!-- Links: orders.userId to users, orders.items to products -->
<path class="ln" d="M820 130 H790 V48 H220 V68" marker-end="url(#arr)"/>
<text class="s" x="505" y="40" text-anchor="middle">orders.userId references users</text>
<path class="ln" d="M820 158 H762" marker-end="url(#arr)"/>

<!-- Role boundary band -->
<path class="ln" d="M60 490 H1140" style="stroke:#727272"/>
<text class="k" x="60" y="478">Endpoints, same API, access decided by role</text>

<!-- user lane -->
<text class="k" x="60" y="524" style="fill:#727272">authUser, any signed-in customer</text>
<g class="l">
  <text x="60" y="556">POST /user/register, /login</text>
  <text x="440" y="556">GET /product/list, POST /single</text>
  <text x="820" y="556">POST /order/place, /userorders</text>
</g>
<text class="s" x="820" y="580">place also clears cartData and emails the receipt</text>

<!-- The boundary itself -->
<path class="ln acc dash" d="M356 606 H1140"/>
<rect class="box acc" x="60" y="594" width="296" height="24"/>
<text class="k a" x="72" y="611">adminAuth: role must be 'admin'</text>

<!-- admin lane -->
<text class="k" x="60" y="646" style="fill:#727272">admin only, same resources</text>
<g class="l">
  <text x="60" y="678">POST /user/admin</text>
  <text x="440" y="678">POST /product/add, /remove</text>
  <text x="820" y="678">POST /order/list, /status, /delete</text>
</g>
<text class="s" x="440" y="702">add takes image1..4, uploads to Cloudinary</text>
<text class="s" x="820" y="702">GET /analytics/dashboard</text>
</svg>
