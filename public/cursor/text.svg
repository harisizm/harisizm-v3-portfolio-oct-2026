<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- text cursor. Hand-built from 2px rects on a 16x16 grid so the edges stay
       stepped. Black outline + white fill so it reads on the #D9D9D9 canvas and on
       the #033FED menu overlay. Hotspot 9 19 (see globals.css). -->
  <g fill="#000000">
    <rect x="4" y="6" width="10" height="2"/>
    <rect x="4" y="8" width="2" height="2"/>
    <rect x="12" y="8" width="2" height="2"/>
    <rect x="6" y="10" width="2" height="2"/>
    <rect x="10" y="10" width="2" height="2"/>
    <rect x="6" y="12" width="2" height="2"/>
    <rect x="10" y="12" width="2" height="2"/>
    <rect x="6" y="14" width="2" height="2"/>
    <rect x="10" y="14" width="2" height="2"/>
    <rect x="6" y="16" width="2" height="2"/>
    <rect x="10" y="16" width="2" height="2"/>
    <rect x="6" y="18" width="2" height="2"/>
    <rect x="10" y="18" width="2" height="2"/>
    <rect x="6" y="20" width="2" height="2"/>
    <rect x="10" y="20" width="2" height="2"/>
    <rect x="6" y="22" width="2" height="2"/>
    <rect x="10" y="22" width="2" height="2"/>
    <rect x="6" y="24" width="2" height="2"/>
    <rect x="10" y="24" width="2" height="2"/>
    <rect x="6" y="26" width="2" height="2"/>
    <rect x="10" y="26" width="2" height="2"/>
    <rect x="4" y="28" width="2" height="2"/>
    <rect x="12" y="28" width="2" height="2"/>
    <rect x="4" y="30" width="10" height="2"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="6" y="8" width="6" height="2"/>
    <rect x="8" y="10" width="2" height="2"/>
    <rect x="8" y="12" width="2" height="2"/>
    <rect x="8" y="14" width="2" height="2"/>
    <rect x="8" y="16" width="2" height="2"/>
    <rect x="8" y="18" width="2" height="2"/>
    <rect x="8" y="20" width="2" height="2"/>
    <rect x="8" y="22" width="2" height="2"/>
    <rect x="8" y="24" width="2" height="2"/>
    <rect x="8" y="26" width="2" height="2"/>
    <rect x="6" y="28" width="6" height="2"/>
  </g>
</svg>
