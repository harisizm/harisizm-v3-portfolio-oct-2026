<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240">
  <title>harisizm: stacked in the reticle, the slot cycling through the role, the caret and Lahore's coordinates</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&amp;family=Inter:wght@500&amp;display=swap');
    .slot { opacity: 0; animation: cycle 9.6s infinite; }
    .slot.role { animation-delay: 0s; }
    .slot.caret { animation-delay: 3.2s; }
    .slot.coords { animation-delay: 6.4s; }
    @keyframes cycle {
      0%, 2% { opacity: 0; transform: translateY(10px); }
      5%, 30% { opacity: 1; transform: translateY(0); }
      33%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    .blink { animation: blink 1s steps(1, end) infinite; }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0.15; } }
    @media (prefers-reduced-motion: reduce) {
      .slot { animation: none; }
      .slot.role { opacity: 1; }
      .blink { animation: none; }
    }
  </style>
  <rect width="720" height="240" fill="#EFECE6"/>
  <g fill="none" stroke="#C23A05" stroke-width="3">
    <path d="M220 44v-16h16M484 28h16v16M220 196v16h16M484 212h16v-16"/>
  </g>
  <text x="246" y="118" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="82" letter-spacing="1" fill="#151515">haris</text>
  <text x="246" y="194" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="82" letter-spacing="1" fill="#C23A05">izm</text>
  <g class="slot role">
    <text x="404" y="170" font-family="Inter, sans-serif" font-weight="500" font-size="13" letter-spacing="2.2" fill="#1F3A5F">FULL-STACK</text>
    <text x="404" y="190" font-family="Inter, sans-serif" font-weight="500" font-size="13" letter-spacing="2.2" fill="#1F3A5F">ENGINEER</text>
  </g>
  <g class="slot caret">
    <rect class="blink" x="412" y="146" width="22" height="50" fill="#C23A05"/>
  </g>
  <g class="slot coords">
    <text x="404" y="172" font-family="Inter, sans-serif" font-weight="500" font-size="14" letter-spacing="2" fill="#1F3A5F">31.52° N</text>
    <text x="404" y="192" font-family="Inter, sans-serif" font-weight="500" font-size="14" letter-spacing="2" fill="#1F3A5F">74.35° E</text>
  </g>
</svg>
